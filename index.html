<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>EVAN-10 BING MUSIC SYSTEM</title>
    <style>
        body { background: #002244; color: #00ffff; font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .bing-frame { width: 550px; border: 2px solid #00ffff; background: #001122; padding: 25px; box-shadow: 0 0 40px #00ffff44; border-radius: 12px; }
        .bing-header { font-weight: bold; font-size: 16px; margin-bottom: 20px; color: white; display: flex; align-items: center; gap: 10px; }
        
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; background: #002244; border: 1px solid #00ffff; color: white; padding: 12px; border-radius: 5px; outline: none; }
        button { background: #00ffff; color: #002244; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; border-radius: 5px; }
        
        #results-node { width: 100%; height: 350px; background: white; border-radius: 8px; overflow: hidden; border: 2px solid #0055ff; }
        iframe { width: 100%; height: 100%; border: none; }

        .footer { font-size: 10px; color: #008888; margin-top: 15px; font-family: monospace; }
        .motto { font-size: 9px; color: #00ffff; margin-top: 10px; text-align: center; font-style: italic; }
    </style>
</head>
<body>

<div class="bing-frame">
    <div class="bing-header">🔍 EVAN-10 BING MUSIC INTERFACE</div>
    
    <div class="search-area">
        <div class="search-box">
            <input type="text" id="bingQuery" placeholder="Escribe el nombre de la música..." onkeyup="if(event.key==='Enter') searchInBing()">
            <button onclick="searchInBing()">BUSCAR</button>
        </div>
    </div>

    <div id="results-node">
        <div style="color:#002244; display:flex; height:100%; align-items:center; justify-content:center; text-align:center; padding:20px;">
            SISTEMA BING LISTO.<br>Escribe una canción para ver las opciones de música.
        </div>
    </div>

    <div class="footer">
        > PROTOCOLO: BING_REDIRECTION_BYPASS <br>
        > ID: EVAN-10129080 | ANTI-SECURLY ACTIVE
    </div>
    
    <div class="motto">"La identidad no reside en la apariencia, sino en la historia que llevamos grabada en el alma"</div>
</div>

<script>
    function searchInBing() {
        const query = document.getElementById('bingQuery').value;
        const node = document.getElementById('results-node');
        if(!query) return;

        node.innerHTML = "<div style='color:#002244; padding:20px;'>IA de Bing analizando opciones de música...</div>";

        // Usamos la búsqueda de videos/música de Bing
        // Esto te mostrará miniaturas y opciones para reproducir.
        const bingMusicUrl = `https://www.bing.com/videos/search?q=${encodeURIComponent(query)}+music&FORM=HDRSC4`;

        node.innerHTML = `
            <iframe 
                src="${bingMusicUrl}" 
                allowfullscreen>
            </iframe>`;
    }
</script>

</body>
</html>
